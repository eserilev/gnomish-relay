# Supply chain rules for the main workspace (SPEC 14.6).

[licenses]
allow = ["MIT", "Apache-2.0"]
# The bridge crates will need Apache-2.0. The core has no dependencies yet.
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
skip = [
  { crate = "miniz_oxide@0.8", reason = "png 0.18 uses it directly and 0.9 through flate2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
