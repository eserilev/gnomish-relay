# Supply chain rules for the main workspace (SPEC 14.6).

[licenses]
# Unicode-3.0 is the data license of `unicode-ident`, which the serde derive macros use.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0"]
unused-allowed-license = "allow"

[bans]
multiple-versions = "deny"
skip = [
  { crate = "miniz_oxide@0.8", reason = "png 0.18 uses it directly and 0.9 through flate2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
