[package]
name = "bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Gnomish Relay bridge: agents on one side, WoW on the other."

[[bin]]
name = "gnomish-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# The strip tag (SPEC.md 6.3). `verify_truncated_left` compares in constant time.
hmac = "0.12"
sha2 = "0.10"
png = "0.18.1"
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Tests run the addon in a real Lua 5.1, the Lua version of WoW.
mlua = { version = "0.10", features = ["lua51", "vendored"] }
tempfile = "3"

[lints]
workspace = true
