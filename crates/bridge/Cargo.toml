[package]
name = "bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Gnomish Relay bridge: agents on one side, WoW on the other."

[[bin]]
name = "gnomish-relay"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# The strip tag (SPEC.md 6.3). `verify_truncated_left` compares in constant time.
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.4"
png = "0.18.1"
app-protocol = { path = "../app-protocol" }
protocol = { path = "../protocol" }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
serde = { version = "1", features = ["derive"] }
# `hooks install` keeps the keys of the settings of the user in their order (SPEC.md 10.5).
serde_json = { version = "1", features = ["preserve_order"] }
# The command of a Codex approval is joined by the shlex crate, so the same crate splits it.
shlex = "1.3"
# The empty private folder of each model call of the story program (SPEC.md 9.7, decision 10).
tempfile = "3"

[dev-dependencies]
# Tests run the addon in a real Lua 5.1, the Lua version of WoW.
mlua = { version = "0.10", features = ["lua51", "vendored"] }

[lints]
workspace = true
