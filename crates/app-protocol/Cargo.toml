[package]
name = "app-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The lines between the bridge, a Gnomish Relay app, and its story program. No I/O."

[dependencies]
protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
# The bridge needs `preserve_order` (SPEC.md 10.5). Cargo turns it on for the whole
# build, so this crate asks for it too, and its lines keep one key order in every build.
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true
