[workspace]
resolver = "3"
members = ["crates/protocol", "crates/app-protocol", "crates/bridge"]

[workspace.package]
version = "0.4.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/eserilev/gnomish-relay"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
# Its fix, `assert_eq!(x, [] as [T; 0])`, reads worse than `assert!(x.is_empty())`.
assert_is_empty = "allow"
