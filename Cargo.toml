[workspace]
resolver = "3"
members = ["crates/protocol", "crates/bridge"]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/eserilev/gnomish-relay"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
