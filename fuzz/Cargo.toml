[package]
name = "protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"
mlua = { version = "0.10", features = ["lua51", "vendored"] }
protocol = { path = "../crates/protocol" }
bridge = { path = "../crates/bridge" }

# Not a member of the main workspace: fuzzing needs nightly and libFuzzer.
[workspace]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false
bench = false

