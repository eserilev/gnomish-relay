# Every action is pinned to a commit (SPEC 14.6). The comment gives the tag.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The weekly run checks every job, also the ones that the path filter skips.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The proofs and the model take minutes, so they run only when their inputs change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      proofs: ${{ steps.diff.outputs.proofs }}
      model: ${{ steps.diff.outputs.model }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: scripts/ci-changes.sh "$BASE" >> "$GITHUB_OUTPUT"

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit

  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: stylua,selene
      - run: stylua --check addon
      - run: selene addon/GnomishRelay
      # Every WoW name that the addon uses must be in the pinned client, and not deprecated.
      - run: scripts/wow-api.sh
      - run: git diff --exit-code -- addon/tests/api.lua

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-llvm-cov
      - run: scripts/check-coverage.sh

  model:
    needs: changes
    if: needs.changes.outputs.model == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install -g @informalsystems/quint@0.32.0
      - run: scripts/check-model.sh

  # One job per target, so they run side by side. Nightly runs each for 600 seconds.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [frame, records, folder, lua, lua_model, chat_text, popup, screenshot, relay, saved, config, live, restore, flags, acp, markdown, claude, codex, action]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      # From source: the prebuilt cargo-fuzz targets musl, and the sanitizer needs glibc.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: scripts/fuzz.sh 15 ${{ matrix.target }}

  proofs:
    needs: changes
    if: needs.changes.outputs.proofs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
      # The Nix store keeps the built tools, so only a change in proofs/TOOLS rebuilds them.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-charon-aeneas-${{ hashFiles('proofs/TOOLS') }}
      # The Aeneas flake pins the Charon commit that proofs/TOOLS names.
      - name: Build Charon and Aeneas
        run: |
          aeneas=$(awk '$1 == "aeneas" { print $2 }' proofs/TOOLS)
          nix build "github:aeneasverif/aeneas/$aeneas#charon" -o "$RUNNER_TEMP/charon" -L
          nix build "github:aeneasverif/aeneas/$aeneas#aeneas" -o "$RUNNER_TEMP/aeneas" -L
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/227caca133724d5516bee25c2aeb3e609478f2d8/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: proofs/.lake
          key: lake-${{ hashFiles('proofs/lake-manifest.json', 'proofs/lean-toolchain') }}
      - name: Get the Mathlib build cache
        working-directory: proofs
        run: lake exe cache get
      - name: Check the proofs
        env:
          CHARON_DIR: ${{ runner.temp }}/charon
          AENEAS_DIR: ${{ runner.temp }}/aeneas
        run: scripts/check-proofs.sh
