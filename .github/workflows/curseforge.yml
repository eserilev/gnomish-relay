# Builds the zip of the relay addon, and uploads it to CurseForge with the BigWigs packager
# (SPEC.md 11.3). Only release.yml uploads: it calls this file after every job of ci.yml
# passed on the tag and the GitHub release is out (14.7). A run by hand only builds the
# zip. The upload needs two things that the maintainer makes once: the secret CF_API_KEY,
# and the project id, in the repo variable CURSEFORGE_PROJECT_ID or in
# `## X-Curse-Project-ID` of GnomishRelay.toc. Without both, the job still builds the zip
# and keeps it as an artifact of the run. The changelog of the file is the section of the
# version in CHANGELOG.md.
name: curseforge

on:
  workflow_call:
    inputs:
      upload:
        type: boolean
        default: false
    secrets:
      CF_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Find the project id
        id: project
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          UPLOAD: ${{ inputs.upload }}
        run: |
          id=${PROJECT_ID:-$(awk -F: '/^## X-Curse-Project-ID:/ { gsub(/[ \t\r]/, "", $2); print $2 }' addon/GnomishRelay/GnomishRelay.toc)}
          if [[ $UPLOAD == true && $GITHUB_REF_TYPE == tag && $id =~ ^[0-9]+$ && -n $CF_API_KEY ]]; then
            echo "args=-p $id" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CurseForge upload: only a release uploads, and it needs the secret CF_API_KEY and a numeric project id (see docs/RELEASING.md, CurseForge setup)."
            echo "args=-d" >> "$GITHUB_OUTPUT"
          fi
      # The packager ships only files that git tracks. So the folder gets a repo of its
      # own, with the transport as real files and the tag of this run.
      - name: Make the addon folder
        run: |
          dir=$(scripts/package-addon.sh "$RUNNER_TEMP/curseforge")
          cd "$dir"
          git init -q
          git add -A
          git -c user.name=release -c user.email=release@localhost commit -q -m "$GITHUB_REF_NAME"
          git tag "$GITHUB_REF_NAME"
          echo "ADDON_DIR=$dir" >> "$GITHUB_ENV"
      # The file gets the same notes as the GitHub release. .pkgmeta names this changelog
      # and keeps it out of the zip.
      - name: Write the changelog
        run: |
          version=$(awk '/^## Version:/ { print $3 }' addon/GnomishRelay/GnomishRelay.toc)
          scripts/changelog-section.sh "$version" > "$ADDON_DIR/CHANGELOG.md"
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        with:
          args: -t ${{ env.ADDON_DIR }} -r ${{ runner.temp }}/release ${{ steps.project.outputs.args }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GnomishRelay-addon
          path: ${{ runner.temp }}/release/*.zip
