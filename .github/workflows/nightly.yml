# The long fuzz run (SPEC 14.4), and the check for a new WoW Forever client (SPEC 7.8).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      # From source: the prebuilt cargo-fuzz targets musl, and the sanitizer needs glibc.
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: scripts/fuzz.sh 600
      - name: Keep the crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  # Blizzard patches the client without notice. This job checks the addon against
  # the newest `forever` branch of both API sources, and opens an issue on a change.
  wow-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - run: scripts/wow-api.sh --latest
      - run: git diff --exit-code -- addon/tests/api.lua addon/tests/api-signatures.lua
      - run: cargo test -p bridge --test addon_flow
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The WoW Forever API changed"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$title" --body "The nightly API check failed: $RUN. Update the pinned commits in scripts/wow-api.sh, run it, and fix what breaks. The diff of addon/tests/api-signatures.lua names each changed argument, return, or secret flag."
          fi
