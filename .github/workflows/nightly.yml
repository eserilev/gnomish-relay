# The long fuzz run (SPEC 14.4), and the check for a new WoW Forever client (SPEC 7.8).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One job per target, so they run side by side: 10 minutes each, not 4 hours in a row.
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        target: [frame, records, folder, lua, lua_model, chat_text, popup, screenshot, relay, saved, config, live, restore, flags, acp, markdown, claude, codex, action, app_protocol, model_http, sandbox, connect, public_ip, always, agent_wall, rules_file, harness, hook_input, notice_file, hooks_merge]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      # From source: the prebuilt cargo-fuzz targets musl, and the sanitizer needs glibc.
      # The cache keeps the built program, so only a new version builds it again.
      - id: cargo-fuzz
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-0.13.2-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: scripts/fuzz.sh 600 ${{ matrix.target }}
      - name: Keep the crash inputs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.target }}
          path: fuzz/artifacts

  # Blizzard patches the client without notice. This job checks the addon against
  # the newest branch of each client in both API sources, and opens an issue on a change.
  wow-api:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - run: scripts/wow-api.sh --latest
      - run: scripts/wow-api.sh --latest --client anniversary
      - run: scripts/selftest-api.sh --latest
      - run: git diff --exit-code -- addon/tests/api.lua addon/tests/api-signatures.lua addon/tests/api-anniversary.lua addon/tests/api-signatures-anniversary.lua addon/tests/selftest-api.lua addon/tests/selftest-api-signatures.lua
      - run: cargo test -p bridge --test addon_flow
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The WoW API changed"
          if [ -z "$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            gh issue create --title "$title" --body "The nightly API check failed: $RUN. Update the pinned commits of the changed client in scripts/wow-api.sh, run it, and fix what breaks. The diff of addon/tests/api-signatures.lua or api-signatures-anniversary.lua names each changed argument, return, or secret flag."
          fi
