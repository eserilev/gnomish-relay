# Runs all of ci.yml on the tagged commit, builds the program for each OS, and attaches it
# to a GitHub Release with its SHA-256 sum and the notes of CHANGELOG.md (SPEC.md 11.3,
# 14.7). Then it uploads the addon to CurseForge. scripts/install.sh and install.ps1
# download from the latest release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# A new stable Rust can add a lint that fails clippy, as 1.99 did to 0.4.0. So a release
# checks and builds with one fixed version, and CI on main uses the newest stable to find
# such a lint first. Raise this after CI on main passed with the newer version.
env:
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  # The tag names the version that the program and the addon carry.
  version:
    runs-on: ubuntu-latest
    # A reusable workflow cannot read `env`, so the version passes through this output.
    outputs:
      toolchain: ${{ env.RUST_TOOLCHAIN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: |
          cargo=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          toc=$(awk '/^## Version:/ { print $3 }' addon/GnomishRelay/GnomishRelay.toc)
          if [ "$GITHUB_REF_NAME" != "v$cargo" ] || [ "$toc" != "$cargo" ]; then
            echo "error: tag $GITHUB_REF_NAME, Cargo.toml $cargo, and GnomishRelay.toc $toc do not match" >&2
            exit 1
          fi
      # Players read these notes on GitHub and CurseForge, so a release needs them first.
      - run: scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > /dev/null
      # The packager warns and tags an older game version when CurseForge lacks one. The
      # check runs here, before anything is published, so a release is never half out
      # (SPEC.md 7.9). With no CF_API_KEY, as in a fork, there is no upload to protect.
      - name: Check the CurseForge game versions
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
        run: |
          if [ -z "$CF_API_KEY" ]; then
            echo "::notice::No CF_API_KEY, so no CurseForge upload and no game version check."
          else
            python3 scripts/curseforge_versions.py addon/GnomishRelay/GnomishRelay.toc
          fi

  # The gate: a tag can point at a commit that CI never checked. Every job of ci.yml runs
  # on the tagged commit, and nothing publishes unless all of them pass.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    with:
      all: true
      toolchain: ${{ needs.version.outputs.toolchain }}

  # The release starts as a draft, so nobody downloads half of it.
  draft:
    needs: [version, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$RUNNER_TEMP/notes.md
          scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > "$notes"
          printf '\nInstall: see the [README](%s#install).\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" >> "$notes"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "$GITHUB_REF_NAME" --notes-file "$notes"

  build:
    needs: draft
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --bin gnomish-relay --target ${{ matrix.target }}
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/package.sh ${{ matrix.target }}
          gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

  # The addon goes out last: when CurseForge updates it, the desktop app updates itself
  # from the latest GitHub release, so that release must have its files (11.3).
  curseforge:
    needs: publish
    uses: ./.github/workflows/curseforge.yml
    with:
      upload: true
    secrets:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
